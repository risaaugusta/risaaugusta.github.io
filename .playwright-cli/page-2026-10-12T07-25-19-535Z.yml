                            - generic [ref=e261]:
                              - text: "Being a Senior Engineer means being less of a Junior Human. It’s not just about years or titles, it’s how you show up as a person and teammate: → Own impact, don’t seek applause. → Listen deeply before jumping in. → Lead with empathy, not ego. → Fix not just bugs, but broken team dynamics. → Push back thoughtfully and know when to adapt. → Stay steady when chaos hits, keep the flow smooth. → Turn jargon into clear, actionable plans. → Write docs that make tough ideas simple. → Share knowledge generously; don’t hoard credit. → Ask the tough questions that really matter. → Bring calm and order when everything feels messy. Being “senior” isn’t about a label, it’s about shedding junior habits and stepping up as a whole human. No matter how “senior” you are, there’s always something to learn, and someone to learn from. If you want to be a true senior, start by being less of a junior human. Because leadership is earned by how you act, not what your title says. What are some good traits you’ve seen in seniors you’ve worked with?"
